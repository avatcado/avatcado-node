name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # tests/live.test.ts runs against the real API in test mode when this secret exists,
      # and is skipped when it does not (forks, or before the secret is added).
      - run: npm test
        env:
          AVATCADO_TEST_API_KEY: ${{ secrets.AVATCADO_TEST_API_KEY }}
      - run: npm run build
